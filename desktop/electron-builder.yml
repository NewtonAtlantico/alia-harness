appId: br.com.atlantico.alia-harness
productName: alia Harness
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
npmRebuild: false
