appId: br.com.atlantico.alia-harness
productName: alia Harness
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
npmRebuild: false
# Electron fuses: switches baked into the executable, so a user (or malware running as the user) cannot turn the
# app into a general-purpose Node interpreter or attach a debugger through environment variables or flags.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
